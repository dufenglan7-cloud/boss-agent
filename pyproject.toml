[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boss-agent"
version = "0.1.0"
description = "Resume-aware multi-agent job application workflow"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "httpx>=0.27,<1", "langgraph>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
observability = ["langfuse>=4.18,<5"]

[project.scripts]
boss-agent = "boss_agent.cli:main"
boss-agent-server = "boss_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boss_agent = ["web/*.html", "web/*.css", "web/*.js"]
